openapi: 3.0.3
info:
  title: 生活選物店 API
  version: 0.3.1
  description: |
    生活選物店後端 API。供前端 `hexschool-store-frontend` 串接。

    ## 回應格式
    - 成功：`{ "success": true, "data": { ... } }`
    - 失敗：`{ "success": false, "error": { "code", "message", "details" } }`

    ## 驗證方式
    登入或註冊後會取得 `accessToken`（有效期 7 天）。需要驗證的 API 請在標頭帶入：

    `Authorization: Bearer <accessToken>`

    過期、竄改或缺少 token 一律回 401 `UNAUTHORIZED`。

    ## 通用錯誤
    - 任何帶 JSON body 的請求，內容超過 100 KB 回 413 `PAYLOAD_TOO_LARGE`。
    - 未預期的伺服器錯誤回 500 `INTERNAL_ERROR`，訊息固定，不含內部細節。
    - 不存在的路徑回 404 `NOT_FOUND`。

    ## 文件
    - 本文件的 JSON 版本在 `/openapi.json`（可直接匯入 Postman）；互動式介面在 `/api-docs`。
servers:
  - url: http://localhost:3000
    description: 本機開發
tags:
  - name: Auth
    description: 會員註冊、登入與個人資料
  - name: Products
    description: 商品瀏覽（公開）與商品管理（僅管理員）
  - name: Categories
    description: 商品分類（公開，唯讀）
  - name: Cart
    description: 購物車（需登入，只能操作自己的購物車）
  - name: System
    description: 服務狀態
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: 註冊
      description: |
        以 email 與密碼註冊一般會員，成功後直接回傳 token。

        - 新帳號角色固定為 `USER`。
        - 請求含未定義欄位（例如 `role`、`isAdmin`）會回 400。
        - email 會轉小寫並去除頭尾空白，大小寫不同視為同一個 email。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: Passw0rdOk
              name: 小明
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: email 已被使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: 此 email 已被註冊
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: 登入
      description: |
        以 email 與密碼登入。email 或密碼錯誤時回應相同，不透露是哪一個錯誤。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: Passw0rdOk
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: email 或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: email 或密碼錯誤
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 取得目前登入者資料
      description: |
        回傳目前登入者的資料，前端可用來在重新整理頁面後還原登入狀態。
        token 有效但使用者已不存在時回 401。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: 商品列表
      description: |
        所有人皆可瀏覽，支援分頁、分類篩選、關鍵字搜尋與排序。

        - 參數不合法（0、負數、非整數、超過上限、未知的 `sort`、空的 `q`）或帶有未定義的查詢參數，一律回 400，不靜默修正。
        - 沒有關鍵字時請**省略** `q`，不要送空字串。
        - `page` 超過最後一頁、`category` 不存在、查無結果，都是 200 加空的 `items`。
        - 排序附帶 `id` 作次要排序，逐頁取完不會重複或遺漏。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: category
          in: query
          description: 分類 id。不存在的分類回空列表。
          schema:
            type: string
        - name: q
          in: query
          description: 關鍵字，1～50 字元。不分大小寫，比對 `name` 與 `description`；`%`、`_` 視為一般字元。
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              example:
                success: true
                data:
                  items:
                    - id: seed-product-01
                      name: 木質收納盒
                      description: 桌面小物收納，天然橡木。
                      price: 580
                      imageUrl: https://images.example.com/box.jpg
                      category:
                        id: seed-category-storage
                        name: 收納
                      createdAt: '2026-11-21T10:00:00.000Z'
                      updatedAt: '2026-11-21T10:00:00.000Z'
                  meta:
                    page: 1
                    limit: 12
                    total: 24
                    totalPages: 2
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: 新增商品（管理員）
      description: |
        僅管理員可用。一般會員回 403，未登入回 401。

        - `price` 為整數（新台幣元），1～1,000,000。
        - `imageUrl` 僅接受 `https://`。
        - `categoryId` 必須是已存在的分類。
        - 含未定義欄位回 400。
        - **此操作不具冪等性**：每次成功的請求都會建立一筆新商品，網路重試可能產生重複商品；請避免自動重送。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              name: 木質收納盒
              description: 桌面小物收納，天然橡木。
              price: 580
              imageUrl: https://images.example.com/box.jpg
              categoryId: seed-category-storage
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Products]
      operationId: getProduct
      summary: 單一商品
      description: 所有人皆可瀏覽。商品不存在、已刪除或 id 格式不符皆回 404。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: 部分更新商品（管理員）
      description: |
        僅管理員可用。只送要修改的欄位，至少要有一個欄位，空 body 回 400。
        已刪除的商品回 404。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            example:
              price: 520
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: 刪除商品（管理員）
      description: |
        僅管理員可用。為軟刪除：刪除後公開 API 看不到，資料庫仍保留。
        重複刪除回 404。
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 刪除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: 分類清單
      description: 所有人皆可取得，依名稱排序。分類由 seed 維護，不提供新增、修改或刪除。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              example:
                success: true
                data:
                  items:
                    - id: seed-category-storage
                      name: 收納
                    - id: seed-category-home
                      name: 家居
  /api/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: 查看購物車
      description: |
        回傳目前登入者的購物車，項目依加入時間排序。

        - 購物車中的商品若已被管理員刪除，項目仍會列出，但 `available` 為 `false`，
          且**不計入** `totalQuantity` 與 `totalPrice`；使用者可自行移除。
        - `itemCount` 包含不可購買的項目。
        - 價格一律使用商品目前的價格，不做快照。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/cart/items/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Cart]
      operationId: setCartItemQuantity
      summary: 設定商品數量（沒有則加入）
      description: |
        把該商品的數量**設成**指定值；購物車裡沒有它就新增。這不是「累加」：
        重複送出相同請求，結果相同（冪等）。

        前端的「加入購物車」＝目前數量 + 1。每次成功後請以回應的 `cart` 覆蓋本地狀態。

        - `quantity` 為 1～99 的整數；0、負數、小數、超過 99 回 400。要移除請用 `DELETE`。
        - 購物車最多 50 種商品；新增第 51 種回 400，已存在的項目仍可修改數量。
        - 商品不存在、已刪除或 id 格式不符回 404。
        - 請求 body 不可含 `userId`、`price` 等欄位，身分一律取自 token。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCartItemRequest'
            example:
              quantity: 2
      responses:
        '200':
          description: 設定成功，回傳完整購物車
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: 移除購物車項目
      description: |
        移除該商品，回傳移除後的完整購物車。已不可購買的項目也可以移除。
        項目不在購物車中（含重複移除）回 404。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 移除成功，回傳完整購物車
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 健康檢查
      description: |
        只確認服務程序存活，**不查詢資料庫**，因此不會喚醒休眠中的資料庫。
        回應不使用共用的 `{ success, data }` 格式。
      responses:
        '200':
          description: 服務存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登入或註冊取得的 `accessToken`，有效期 7 天。
  schemas:
    UserRole:
      type: string
      enum: [USER, ADMIN]
      description: 使用者角色。註冊一律為 `USER`，無法由使用者自行變更。
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: string
          example: clx1a2b3c0000abcd1234efgh
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: 小明
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-21T10:00:00.000Z'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 至少 8 字元、最多 72 bytes（UTF-8），需含英文字母與數字。多位元組字元（如中文）每字佔 3 bytes。
        name:
          type: string
          minLength: 1
          maxLength: 50
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthData:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT，有效期 7 天。
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AuthSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthData'
    CurrentUserSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: seed-category-storage
        name:
          type: string
          example: 收納
    Product:
      type: object
      required: [id, name, description, price, imageUrl, category, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: seed-product-01
        name:
          type: string
          example: 木質收納盒
        description:
          type: string
          example: 桌面小物收納，天然橡木。
        price:
          type: integer
          description: 新台幣元，整數。
          example: 580
        imageUrl:
          type: string
          format: uri
          description: 僅 `https://` 網址。
          example: https://images.example.com/box.jpg
        category:
          $ref: '#/components/schemas/Category'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, description, price, imageUrl, categoryId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 2000
        price:
          type: integer
          minimum: 1
          maximum: 1000000
        imageUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        categoryId:
          type: string
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 2000
        price:
          type: integer
          minimum: 1
          maximum: 1000000
        imageUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        categoryId:
          type: string
    ProductListMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: 符合條件的商品總數。
        totalPages:
          type: integer
          description: 無資料時為 0。
    ProductListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            meta:
              $ref: '#/components/schemas/ProductListMeta'
    ProductSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [product]
          properties:
            product:
              $ref: '#/components/schemas/Product'
    CategoryListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Category'
    CartItemProduct:
      type: object
      required: [id, name, price, imageUrl, category]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
          description: 商品目前的價格（新台幣元），不做快照。
        imageUrl:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/Category'
    CartItem:
      type: object
      required: [product, quantity, subtotal, available]
      properties:
        product:
          $ref: '#/components/schemas/CartItemProduct'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        subtotal:
          type: integer
          description: 商品目前價格 × `quantity`。不可購買的項目也會回傳，但不計入購物車總計。
        available:
          type: boolean
          description: 商品未被刪除為 `true`；`false` 時不可調整數量，只能移除。
    Cart:
      type: object
      required: [items, itemCount, totalQuantity, totalPrice]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItem'
        itemCount:
          type: integer
          description: 項目數，**包含**不可購買的項目。
        totalQuantity:
          type: integer
          description: 數量總和，只計 `available` 為 `true` 的項目。
        totalPrice:
          type: integer
          description: 價格總和，只計 `available` 為 `true` 的項目。
    CartResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [cart]
          properties:
            cart:
              $ref: '#/components/schemas/Cart'
    SetCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
      description: |
        - `VALIDATION_ERROR`（400）：欄位缺漏、格式錯誤或含未定義欄位
        - `INVALID_CREDENTIALS`（401）：登入的 email 或密碼錯誤
        - `UNAUTHORIZED`（401）：缺少、無效、竄改或過期的 token，或使用者已不存在
        - `FORBIDDEN`（403）：已登入但權限不足
        - `NOT_FOUND`（404）：資源不存在、已刪除，或 id 格式不符
        - `EMAIL_ALREADY_EXISTS`（409）：email 已被使用
        - `PAYLOAD_TOO_LARGE`（413）：請求內容超過 100 KB
        - `INTERNAL_ERROR`（500）：未預期的伺服器錯誤
    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: 至少 8 字元
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          description: 僅 `VALIDATION_ERROR` 會帶，逐欄位說明。
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorBody'
  responses:
    NotFound:
      description: 資源不存在、已刪除，或 id 格式不符
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: 商品不存在或已下架
    ValidationError:
      description: 請求欄位驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidField:
              summary: 欄位格式錯誤
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 請求欄位驗證失敗
                  details:
                    - field: password
                      message: 至少 8 字元
            unknownField:
              summary: 含未定義欄位（例如 role）
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 請求欄位驗證失敗
                  details:
                    - field: role
                      message: 不允許的欄位
    Unauthorized:
      description: 缺少、無效、竄改或過期的 token，或使用者已不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 請先登入
    Forbidden:
      description: 已登入但權限不足（供管理員 API 使用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: 權限不足
