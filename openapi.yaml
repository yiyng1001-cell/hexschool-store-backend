openapi: 3.0.3
info:
  title: 生活選物店 API
  version: 0.1.0
  description: |
    生活選物店後端 API。供前端 `hexschool-store-frontend` 串接。

    ## 回應格式
    - 成功：`{ "success": true, "data": { ... } }`
    - 失敗：`{ "success": false, "error": { "code", "message", "details" } }`

    ## 驗證方式
    登入或註冊後會取得 `accessToken`（有效期 7 天）。需要驗證的 API 請在標頭帶入：

    `Authorization: Bearer <accessToken>`

    過期、竄改或缺少 token 一律回 401 `UNAUTHORIZED`。
servers:
  - url: http://localhost:3000
    description: 本機開發
tags:
  - name: Auth
    description: 會員註冊、登入與個人資料
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: 註冊
      description: |
        以 email 與密碼註冊一般會員，成功後直接回傳 token。

        - 新帳號角色固定為 `USER`。
        - 請求含未定義欄位（例如 `role`、`isAdmin`）會回 400。
        - email 會轉小寫並去除頭尾空白，大小寫不同視為同一個 email。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: Passw0rdOk
              name: 小明
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: email 已被使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: 此 email 已被註冊
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: 登入
      description: |
        以 email 與密碼登入。email 或密碼錯誤時回應相同，不透露是哪一個錯誤。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: Passw0rdOk
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: email 或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: email 或密碼錯誤
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 取得目前登入者資料
      description: |
        回傳目前登入者的資料，前端可用來在重新整理頁面後還原登入狀態。
        token 有效但使用者已不存在時回 401。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登入或註冊取得的 `accessToken`，有效期 7 天。
  schemas:
    UserRole:
      type: string
      enum: [USER, ADMIN]
      description: 使用者角色。註冊一律為 `USER`，無法由使用者自行變更。
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: string
          example: clx1a2b3c0000abcd1234efgh
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: 小明
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-21T10:00:00.000Z'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8～72 字元，需含英文與數字。
        name:
          type: string
          minLength: 1
          maxLength: 50
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthData:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT，有效期 7 天。
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AuthSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthData'
    CurrentUserSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - FORBIDDEN
        - EMAIL_ALREADY_EXISTS
      description: |
        - `VALIDATION_ERROR`（400）：欄位缺漏、格式錯誤或含未定義欄位
        - `INVALID_CREDENTIALS`（401）：登入的 email 或密碼錯誤
        - `UNAUTHORIZED`（401）：缺少、無效、竄改或過期的 token，或使用者已不存在
        - `FORBIDDEN`（403）：已登入但權限不足
        - `EMAIL_ALREADY_EXISTS`（409）：email 已被使用
    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: 至少 8 字元
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          description: 僅 `VALIDATION_ERROR` 會帶，逐欄位說明。
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorBody'
  responses:
    ValidationError:
      description: 請求欄位驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidField:
              summary: 欄位格式錯誤
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 請求欄位驗證失敗
                  details:
                    - field: password
                      message: 至少 8 字元
            unknownField:
              summary: 含未定義欄位（例如 role）
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 請求欄位驗證失敗
                  details:
                    - field: role
                      message: 不允許的欄位
    Unauthorized:
      description: 缺少、無效、竄改或過期的 token，或使用者已不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 請先登入
    Forbidden:
      description: 已登入但權限不足（供管理員 API 使用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: 權限不足
